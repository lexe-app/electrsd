name: Build blockstream-electrs release binaries

on:
  workflow_dispatch:

env:
  ELECTRS_REV: ef15bf97b97814bc8ac771e8537dcf1c1779dade

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            artifact_os: linux
          - runner: macos-latest
            system: aarch64-darwin
            artifact_os: macos

    steps:
      - name: Check out electrsd
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0

      - name: Build blockstream-electrs
        run: nix-build default.nix -A blockstream-electrs --out-link result

      - name: Verify binary architecture
        shell: bash
        run: |
          file result/bin/electrs
          if [[ "${{ matrix.system }}" == "x86_64-linux" ]]; then
            file result/bin/electrs \
              | grep --extended-regexp --quiet 'x86-64.*(statically|static-pie) linked'
          else
            file result/bin/electrs | grep --quiet 'Mach-O 64-bit executable arm64'
          fi
          result/bin/electrs --version

      - name: Package binary
        id: package
        shell: bash
        run: |
          artifact="electrs_${{ matrix.artifact_os }}_${ELECTRS_REV}.zip"
          zip -X -j "$artifact" result/bin/electrs
          shasum -a 256 "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: electrs_${{ matrix.artifact_os }}_${{ env.ELECTRS_REV }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error
          compression-level: 0
