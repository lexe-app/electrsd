name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out electrsd
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: cargo build

  test-downloads:
    name: Test pre-built downloads
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUST_LOG: debug

    steps:
      - name: Check out electrsd
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features download

  test-nix:
    name: Test Nix electrs package
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      ELECTRSD_SKIP_DOWNLOAD: "1"
      ELECTRS_EXEC: ${{ github.workspace }}/result/bin/electrs
      RUST_LOG: debug

    steps:
      - name: Check out electrsd
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build blockstream-electrs
        run: nix-build default.nix -A blockstream-electrs --out-link result
      - run: cargo test --features download

  cosmetics:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    env:
      BITCOIND_SKIP_DOWNLOAD: "1"
      ELECTRSD_SKIP_DOWNLOAD: "1"

    steps:
      - name: Check out electrsd
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
