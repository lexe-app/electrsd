[package]
name = "electrsd"
version = "0.42.0"
authors = ["Riccardo Casatta <riccardo@casatta.it>"]
description = "Test harness for running Blockstream electrs with a Bitcoin Core regtest node"
repository = "https://github.com/lexe-app/electrsd"
documentation = "https://docs.rs/electrsd/"
license = "MIT"
edition = "2021"
rust-version = "1.75.0"
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]

[dependencies]
bitcoind = { version = "0.41.0", default-features = false, features = ["31_0"] }
corepc-client = { version = "0.16.0" }
electrum-client = { version = "0.24.0", default-features = false }
log = { version = "0.4" }

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.25.0" }

[dev-dependencies]
env_logger = { version = "0.10" }

[build-dependencies]
bitcoin_hashes = { version = "0.14", optional = true }
zip = { version = "0.6", default-features = false, optional = true, features = [
  "bzip2",
  "deflate",
] }
minreq = { version = "2.9.0", default-features = false, optional = true, features = [
  "https",
] }

[features]
download = ["dep:bitcoin_hashes", "dep:zip", "dep:minreq", "bitcoind/download"]
